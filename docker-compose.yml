version: '3.8'
services:
  universe:
    image: civilx-universe-dev:local
    container_name: civilx-universe
    restart: unless-stopped
    ports:
    - 3001:3001
    env_file:
    - universe-src/.env
    environment:
    - NODE_ENV=production
    - PORT=3001
    - HOSTNAME=0.0.0.0
    - NEXT_PUBLIC_API_URL=/api/datalab
    - INTERNAL_API_URL=http://172.17.0.1:8000/api/datalab
    - DOCKER_CONTAINER=true
    volumes:
    - ./universe-src/app:/app/app:ro
    - ./universe-src/components:/app/components:ro
    - ./universe-src/lib:/app/lib:ro
    extra_hosts:
    - host.docker.internal:host-gateway
    networks:
    - app-network
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - 'require(''http'').get(''http://localhost:3001/api/health'', (r) => {process.exit(r.statusCode
        === 200 ? 0 : 1)}).on(''error'', () => process.exit(1))'
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
networks:
  app-network:
    driver: bridge
    name: civilx-universe-network
